<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Premium Car Rental System</title>
<style>
/* Body & Background Animation */
body {
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background: linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#1c1c1c);
  background-size: 400% 400%;
  animation: bgMove 15s infinite alternate;
  color:white;
}
@keyframes bgMove {
  0%{background-position:0% 50%;}
  100%{background-position:100% 50%;}
}

/* Screens */
.screen { display:none; padding:30px; animation: fadeIn 1s ease; }
.active { display:block; }

@keyframes fadeIn {
  from {opacity:0; transform:translateY(20px);}
  to {opacity:1; transform:translateY(0);}
}

/* Buttons */
button {
  padding:10px 20px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  background:linear-gradient(45deg,#ff6b6b,#ff9f43);
  color:white;
  transition:.3s;
}
button:hover { transform:scale(1.1); }

/* Glass UI Boxes */
.glass {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  border-radius:20px;
}

/* Login */
.login-box {
  width:300px;
  margin:auto;
  margin-top:100px;
  text-align:center;
  padding:30px;
}
input {
  width:90%;
  padding:10px;
  margin:10px;
  border:none;
  border-radius:10px;
}

/* Cars Grid */
.car-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  margin-top:30px;
}
.car-card {
  background:white;
  color:black;
  border-radius:15px;
  overflow:hidden;
  transition:.4s;
  cursor:pointer;
}
.car-card:hover {
  transform: scale(1.05) rotate(-1deg);
  box-shadow:0 10px 25px rgba(0,0,0,0.5);
}
.car-card img {
  width:100%;
  height:150px;
  object-fit:cover;
  transition:.5s;
}
.car-card:hover img { transform:scale(1.2); }

/* Details Screen */
.details {
  display:flex;
  gap:30px;
  align-items:center;
  flex-wrap:wrap;
}
.details img {
  width:500px;
  border-radius:20px;
  transition:.3s;
}
.details img:hover { transform:scale(1.05); }

/* Booking Screen */
.booking {
  background: rgba(0,0,0,0.7);
  padding:40px;
  border-radius:30px;
  text-align:center;
  max-width:500px;
  margin:auto;
}
.booking input {
  width:80%;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
  border:none;
}
</style>
</head>

<body>

<!-- SCREEN 1 LOGIN -->
<div id="screen1" class="screen active">
  <div class="login-box glass">
    <h2>Login</h2>
    <input type="text" id="user" placeholder="Username">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- SCREEN 2 CARS -->
<div id="screen2" class="screen">
  <h2 style="text-align:center;">Available Cars</h2>
  <div class="car-grid" id="cars"></div>
</div>

<!-- SCREEN 3 DETAILS -->
<div id="screen3" class="screen">
  <button onclick="back()">⬅ Back</button>
  <div class="details">
    <img id="detailImg">
    <div id="detailBox"></div>
  </div>
</div>

<script>
/* CAR DATA 20 CARS */
const cars = [
{name:"BMW M4",img:"https://images.unsplash.com/photo-1617814076668-7e0d58a0b161",engine:"3.0L Twin Turbo",speed:"280 km/h",price:"₹7000/day"},
{name:"Audi R8",img:"https://images.unsplash.com/photo-1606664515524-ed2f786a0bd6",engine:"5.2L V10",speed:"330 km/h",price:"₹12000/day"},
{name:"Mercedes AMG",img:"https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8",engine:"4.0L V8",speed:"300 km/h",price:"₹9000/day"},
{name:"Tesla Model S",img:"https://images.unsplash.com/photo-1619767886558-efdc7d0c4b0d",engine:"Electric",speed:"250 km/h",price:"₹8000/day"},
{name:"Lamborghini Huracan",img:"https://images.unsplash.com/photo-1621135802920-133df287f89c",engine:"5.2L V10",speed:"340 km/h",price:"₹20000/day"},
{name:"Ferrari 488",img:"https://images.unsplash.com/photo-1592194996308-7b43878e84a6",engine:"3.9L V8",speed:"330 km/h",price:"₹22000/day"},
{name:"Porsche 911",img:"https://images.unsplash.com/photo-1611821064430-0d40291d0f0b",engine:"3.0L Turbo",speed:"310 km/h",price:"₹15000/day"},
{name:"Rolls Royce Phantom",img:"https://images.unsplash.com/photo-1626668893632-6f3a4466d22f",engine:"6.75L V12",speed:"250 km/h",price:"₹30000/day"},
{name:"Bentley Continental",img:"https://images.unsplash.com/photo-1616422285623-13ff0162193c",engine:"6.0L W12",speed:"320 km/h",price:"₹25000/day"},
{name:"Jaguar F-Type",img:"https://images.unsplash.com/photo-1583121274602-3e2820c69888",engine:"5.0L V8",speed:"300 km/h",price:"₹14000/day"},
{name:"Ford Mustang",img:"https://images.unsplash.com/photo-1584345604476-8ec5f452d1f2",engine:"5.0L V8",speed:"260 km/h",price:"₹10000/day"},
{name:"Chevrolet Camaro",img:"https://images.unsplash.com/photo-1611859266238-4b98091d9d9b",engine:"6.2L V8",speed:"290 km/h",price:"₹11000/day"},
{name:"Toyota Supra",img:"https://images.unsplash.com/photo-1617654112328-5d1fbbf96e65",engine:"3.0L Turbo",speed:"250 km/h",price:"₹9000/day"},
{name:"Nissan GTR",img:"https://images.unsplash.com/photo-1603386329225-868f9b1ee6d9",engine:"3.8L V6",speed:"315 km/h",price:"₹16000/day"},
{name:"Kia Sportage",img:"https://images.unsplash.com/photo-1609521263047-f8f205293f24",engine:"2.0L",speed:"200 km/h",price:"₹4000/day"},
{name:"Hyundai Creta",img:"https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2",engine:"1.5L",speed:"180 km/h",price:"₹3500/day"},
{name:"Range Rover",img:"https://images.unsplash.com/photo-1606016159991-ef9b3c2f3e0e",engine:"3.0L",speed:"240 km/h",price:"₹15000/day"},
{name:"Volvo XC90",img:"https://images.unsplash.com/photo-1606664515524-ed2f786a0bd6",engine:"2.0L Hybrid",speed:"220 km/h",price:"₹12000/day"},
{name:"Jeep Wrangler",img:"https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2",engine:"3.6L",speed:"200 km/h",price:"₹8000/day"},
{name:"Mahindra Thar",img:"https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb",engine:"2.2L Diesel",speed:"160 km/h",price:"₹5000/day"}
];

/* LOAD CARS */
const container=document.getElementById("cars");
cars.forEach((car,i)=>{
  let div=document.createElement("div");
  div.className="car-card";
  div.innerHTML=`
    <img src="${car.img}" onerror="this.src='https://images.unsplash.com/photo-1503376780353-7e6692767b70'">
    <h3 style="text-align:center">${car.name}</h3>
  `;
  div.onclick=()=>showDetails(i);
  container.appendChild(div);
});

/* LOGIN */
function login(){
  let u=document.getElementById("user").value;
  let p=document.getElementById("pass").value;
  if(u && p){
    screen1.classList.remove("active");
    screen2.classList.add("active");
  }else{
    alert("Enter username & password");
  }
}

/* SHOW DETAILS */
function showDetails(i){
  let c=cars[i];
  screen2.classList.remove("active");
  screen3.classList.add("active");
  document.getElementById("detailImg").src=c.img;
  document.getElementById("detailBox").innerHTML=`
    <h1>${c.name}</h1>
    <p>Engine: ${c.engine}</p>
    <p>Speed: ${c.speed}</p>
    <p>Price: ${c.price}</p>
    <button onclick="goBooking()">Rent Now</button>
  `;
}

/* NAVIGATION */
function back(){
  screen3.classList.remove("active");
  screen2.classList.add("active");
}
function goBooking(){
  alert("Car Booked 🚗");
}
</script>

</body>
</html>
